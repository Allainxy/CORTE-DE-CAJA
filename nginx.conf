# ================================================================
# K-BOTANAS · corte.kbomx.com
# Frontend estático + proxy al backend Node bajo /api
# Coloca este archivo en /etc/nginx/sites-available/corte.kbomx.com
# y haz symlink a /etc/nginx/sites-enabled/
# ================================================================

# HTTP -> HTTPS (lo activa certbot automáticamente, pero lo dejamos explícito)
server {
    listen 80;
    listen [::]:80;
    server_name corte.kbomx.com;

    # Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corte.kbomx.com;

    # === SSL (lo rellena certbot) ===
    ssl_certificate     /etc/letsencrypt/live/corte.kbomx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corte.kbomx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # === Cabeceras de seguridad ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === Raíz de la PWA (archivos estáticos) ===
    root /var/www/kbotanas;
    index index.html;

    # Tamaño suficiente para subida de XML grandes
    client_max_body_size 25m;

    # Service worker: NUNCA cachear (queremos updates inmediatos)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # manifest.json: cache corto
    location = /manifest.json {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Assets estáticos: cache largo (los nombres no tienen hash, así que 1 día)
    location ~* \.(?:css|js|jsx|png|jpg|jpeg|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # === Proxy al backend Node bajo /api ===
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback (cualquier ruta desconocida -> index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
