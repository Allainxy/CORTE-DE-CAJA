# ================================================================
# K-BOTANAS · Stack completo para DigitalOcean Droplet
#   - backend: Node + better-sqlite3 (interno, no expuesto)
#   - nginx:   sirve PWA estática + proxy a /api + SSL
#   - certbot: emite y renueva el certificado de Let's Encrypt
# Uso:
#   1. Edita .env y pon JWT_SECRET y EMAIL
#   2. docker compose up -d
#   3. ./init-letsencrypt.sh   (la primera vez)
# ================================================================

services:
  backend:
    build: .
    container_name: kbotanas-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en .env}
      - DB_FILE=/data/kbotanas.db
    volumes:
      - kbotanas-data:/data
    expose:
      - "3001"
    # No exponemos puerto al host: solo nginx lo alcanza por la red interna

  nginx:
    image: nginx:1.27-alpine
    container_name: kbotanas-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/kbotanas:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot
    container_name: kbotanas-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  kbotanas-data:
